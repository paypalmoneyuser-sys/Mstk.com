name: Backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "mstk/**"]

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
