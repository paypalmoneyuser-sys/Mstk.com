name: Backend checks

on:
  pull_request:
    branches: [main, "mstk/**"]
  push:
    branches: [main, "mstk/**"]

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build static Cloudflare Pages preview
        run: npm run build:pages
      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: mstk-pages-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mstk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mstk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap minimal Supabase auth test schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d mstk_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_local_auth.sql
      - name: Apply all database migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d mstk_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run RLS and tenant-integrity smoke tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d mstk_test -v ON_ERROR_STOP=1 -f supabase/tests/postgres_smoke.sql
